spring:
  application:
    name: TeamWork
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息：默认连本机 bet_platform 库，
    # 队友可用环境变量 DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD 覆盖各自的本地配置
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bet_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} # 没有密码就空着
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

invite:
  base-url: ${INVITE_BASE_URL:http://localhost:5173}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.spring.teamwork.model.Entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
      db-config:
        logic-delete-field: isDeleted
        logic-delete-value: 1
        logic-not-delete-value: 0
sa-token:
  token-name: Authorization
  # 接口文档 1.1 约定 Authorization: Bearer {token}，Sa-Token 默认会把整个请求头当 token，
  # 必须配置前缀才能让 "Bearer xxx" 中的 xxx 生效（否则登录后第一次鉴权请求就 401）
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1                   # 无自动下线，跟随 timeout
  is-concurrent: true                 # 多端同时登录
  is-share: false                      # 每次登录独立 token
  token-style: uuid
  is-log: false

demo:
  enabled: false
settle:
  remote:
    url: http://localhost:8080
    enabled: true