spring:
  application:
    name: TeamWork
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息：默认连本机 bet_platform 库，
    # 队友可用环境变量 DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD 覆盖各自的本地配置
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bet_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} # 没有密码就空着
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

invite:
  base-url: ${INVITE_BASE_URL:http://localhost:5173}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.spring.teamwork.model.Entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
      db-config:
        logic-delete-field: isDeleted
        logic-delete-value: 1
        logic-not-delete-value: 0
sa-token:
    token-name: Authorization
    timeout: 86400
    active-timeout: -1                   # 无自动下线，跟随 timeout
    is-concurrent: true                 # 多端同时登录
    is-share: false                      # 每次登录独立 token
    token-style: uuid
    is-log: false

  #demo:
  #  enabled:false

# ==== 甲方结算服务配置 ====
settle:
  remote:
    # 联调时改成甲方实际地址；本地没起甲方服务时设 enabled=false 跳过远程调用
    url: http://localhost:8080
    enabled: true