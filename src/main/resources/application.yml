spring:
  application:
    name: TeamWork
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息：默认连本机 bet_platform 库，
    # 队友可用环境变量 DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD 覆盖各自的本地配置
    url: jdbc:mysql://192.168.221.128:3306/bet_platform?...
    username: root
    password: root
  data:
    redis:
      host: 192.168.221.128
      port: 6379
      password: 123789 # 没有密码就空着
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

invite:
  base-url: http://localhost:5173

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.spring.teamwork.model.Entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
      db-config:
        logic-delete-field: isDeleted
        logic-delete-value: 1
        logic-not-delete-value: 0
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1                   # 无自动下线，跟随 timeout
  is-concurrent: true                 # 多端同时登录
  is-share: false                      # 每次登录独立 token
  token-style: uuid
  is-log: false

demo:
  enabled: true
settle:
  remote:
    url: http://localhost:8080
    enabled: true